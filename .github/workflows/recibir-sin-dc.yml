name: ToDus Recibir Canción (sin DC)
on:
  workflow_dispatch:
    inputs:
      runtime:
        description: "Segundos"
        required: false
        default: "300"
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavdevice-dev libavfilter-dev libopus-dev libvpx-dev pkg-config libsrtp2-dev
          pip install --upgrade pip
          pip install aiortc==1.10.1 av==13.1.0 requests aiohttp numpy
      - name: Run answerer sin DC
        env:
          TODUS_PHONE: ${{ secrets.TODUS_PHONE_ANS }}
          RUNTIME: ${{ inputs.runtime }}
          AUDIO_URL: "https://dhruvmirrorpremiumftl2-d46d2f46b91a.herokuapp.com/59967/Lxminal+-+Cool+For+The+Summer+%28Hardstyle+Slowed%29.mp3?hash=AgADXJ"
          AUDIO_FILE: "cancion.mp3"
        run: python recibir_cancion_sin_dc.py
